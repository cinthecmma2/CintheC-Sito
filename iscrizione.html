<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CintheC Media - Iscrizione Atleti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; overflow: hidden; margin: 0; }
        
        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .left-pane {
            flex: 1.3;
            position: relative;
            background-color: #020503;
            overflow: hidden;
            display: none;
        }
        @media (min-width: 1024px) {
            .left-pane { display: block; }
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        .left-pane::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(2,5,3,0.1), rgba(2,5,3,0.95));
            pointer-events: none;
        }

        .right-pane {
            flex: 1;
            background-color: #020503;
            background-image: 
                linear-gradient(to bottom, rgba(2, 5, 3, 0.9), rgba(2, 5, 3, 0.98)),
                url('Immagini/fulmini-bg.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            height: 100vh;
            position: relative;
            overflow-y: hidden;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-float {
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        .animate-live-dot {
            animation: pulseDot 1.5s ease-in-out infinite;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: black;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5);
            z-index: 100;
            transition: transform 0.3s ease, background-color 0.2s;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #20ba5a;
        }

        input:focus, select:focus {
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }

        #successModal {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-black text-zinc-100 antialiased selection:bg-[#00ff66] selection:text-black">

    <div class="split-container">
        
        <div class="left-pane">
            <div class="bg-slide active" style="background-image: url('Immagini/foto-pack1.jpeg');"></div>
            <div class="bg-slide" style="background-image: url('atleti/drenica.jpg');"></div>
            <div class="bg-slide" style="background-image: url('atleti/massimiliano-bello.jpg');"></div>
            <div class="bg-slide" style="background-image: url('atleti/pagotto.jpg');"></div>
            <div class="bg-slide" style="background-image: url('atleti/pitaveric.jpg');"></div>
            
            <div class="absolute bottom-6 left-8 z-10 space-y-1 pointer-events-none">
                <span class="text-[#00ff66] font-black text-xs tracking-widest uppercase">CintheC Official Athletes</span>
                <h3 class="text-3xl font-black uppercase tracking-tight text-white">La Gabbia Chiama</h3>
            </div>
        </div>

        <div class="right-pane w-full">
            <div class="max-w-md w-full bg-zinc-950/95 border border-zinc-800/80 rounded-2xl p-4 shadow-2xl backdrop-blur-md relative my-auto">
                
                <!-- PULSANTE TORNA ALLA HOME EVIDENTE IN ALTO -->
                <div class="mb-2">
                    <a href="index.html" class="flex items-center justify-center gap-2 w-full bg-zinc-900 hover:bg-zinc-800 text-[#00ff66] border border-[#00ff66]/50 py-1.5 px-3 rounded-xl font-black text-xs uppercase tracking-wider transition shadow-md">
                        <i class="fa-solid fa-arrow-left"></i> Torna alla Home
                    </a>
                </div>

                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-[#00ff66] font-black text-[9px] tracking-widest uppercase bg-zinc-900/90 px-2.5 py-0.5 rounded-lg border border-[#00ff66]/40 shadow-lg animate-float">
                        C I N T H E C
                    </span>
                    <div class="flex items-center gap-1.5 bg-zinc-900/80 px-2 py-0.5 rounded-lg border border-zinc-800">
                        <span class="w-2 h-2 rounded-full bg-[#00ff66] animate-live-dot"></span>
                        <span class="text-[8px] font-black uppercase tracking-wider text-zinc-300">Match Open</span>
                    </div>
                </div>

                <div class="text-center mb-2">
                    <h2 class="text-base sm:text-lg font-black uppercase tracking-tight text-white mb-0">Piattaforma Match</h2>
                    <p class="text-[10px] text-[#00ff66] font-semibold">Compila i dati per l'evento</p>
                </div>

                <div class="space-y-1.5">
                    <div>
                        <label class="block text-[9px] font-bold text-zinc-400 uppercase mb-0.5">Nome</label>
                        <input type="text" id="nome" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg px-2.5 py-1 outline-none transition" placeholder="Es. Mario">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-zinc-400 uppercase mb-0.5">Cognome</label>
                        <input type="text" id="cognome" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg px-2.5 py-1 outline-none transition" placeholder="Es. Rossi">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-zinc-400 uppercase mb-0.5">Email</label>
                        <input type="email" id="email" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg px-2.5 py-1 outline-none transition" placeholder="Es. m.rossi@email.com">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-zinc-400 uppercase mb-0.5">Team</label>
                        <input type="text" id="team" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg px-2.5 py-1 outline-none transition" placeholder="Es. Leoni di San Marco">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[9px] font-bold text-zinc-400 uppercase mb-0.5">Peso (kg)</label>
                            <input type="text" id="peso" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg px-2.5 py-1 outline-none transition" placeholder="Es. 70">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-zinc-400 uppercase mb-0.5">Lega</label>
                            <select id="lega" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg px-2 py-1 outline-none transition">
                                <option value="" disabled selected>Seleziona...</option>
                                <option value="Light">Light</option>
                                <option value="Semi-Pro">Semi-Pro</option>
                                <option value="Pro">Pro</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-zinc-400 uppercase mb-0.5">Record Sportivo (Vittorie - Sconfitte - Pareggi)</label>
                        <div class="grid grid-cols-3 gap-1.5">
                            <div>
                                <input type="number" id="vittorie" min="0" value="0" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg py-1 outline-none transition text-center" placeholder="V">
                            </div>
                            <div>
                                <input type="number" id="sconfitte" min="0" value="0" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg py-1 outline-none transition text-center" placeholder="S">
                            </div>
                            <div>
                                <input type="number" id="pareggi" min="0" value="0" class="w-full bg-zinc-900 border border-zinc-800 focus:border-[#00ff66] text-white text-xs rounded-lg py-1 outline-none transition text-center" placeholder="P">
                            </div>
                        </div>
                    </div>

                    <button onclick="inviaDati()" id="submitBtn" class="w-full bg-[#00ff66] hover:bg-[#00cc52] text-black font-black uppercase text-xs tracking-wider py-2 rounded-xl transition shadow-[0_0_12px_rgba(0,255,102,0.3)] cursor-pointer mt-1">
                        Invia Iscrizione
                    </button>
                    
                    <div class="pt-0.5 text-center">
                        <a href="index.html" class="text-zinc-400 hover:text-white transition font-semibold text-[10px]">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Torna alla Home
                        </a>
                    </div>
                </div>

                <div id="successModal" class="absolute inset-0 bg-zinc-950/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-5 text-center opacity-0 pointer-events-none z-50">
                    <div class="w-12 h-12 bg-[#00ff66]/10 border border-[#00ff66] rounded-full flex items-center justify-center text-[#00ff66] text-xl mb-2 shadow-[0_0_20px_rgba(0,255,102,0.3)]">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h3 class="text-base font-black uppercase text-white mb-1">Iscrizione Registrata!</h3>
                    <p class="text-[11px] text-zinc-400 mb-4">I dati dell'atleta e il record sono stati salvati correttamente nel sistema CintheC.</p>
                    <button onclick="chiudiModale()" class="bg-[#00ff66] hover:bg-[#00cc52] text-black font-black uppercase text-[11px] tracking-wider px-5 py-2 rounded-xl transition shadow-[0_0_15px_rgba(0,255,102,0.3)] cursor-pointer">
                        Nuova Iscrizione
                    </button>
                </div>

            </div>
        </div>

    </div>

    <a id="whatsappLink" href="#" target="_blank" class="whatsapp-float" title="Supporto Staff WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>
        const CONFIG_WHATSAPP_NUMBER = "393206819098";
        document.getElementById('whatsappLink').href = `https://wa.me/${CONFIG_WHATSAPP_NUMBER}`;

        let currentSlide = 0;
        const slides = document.querySelectorAll('.bg-slide');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 4500);

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJSPDKtM2XMbiGQD1BQmmbafPPqpFTBxMpVwJyPHHFsEuwiBQAplQR6HwPGE5F1TNs/exec';

        async function inviaDati() {
            const btn = document.getElementById('submitBtn');
            
            const selectLega = document.getElementById('lega');
            const valoreLega = selectLega ? selectLega.value : "";

            const dati = {
                nome: document.getElementById('nome').value.trim(),
                cognome: document.getElementById('cognome').value.trim(),
                email: document.getElementById('email').value.trim(),
                team: document.getElementById('team').value.trim(),
                peso: document.getElementById('peso').value.trim(),
                lega: valoreLega,
                vittorie: document.getElementById('vittorie').value || "0",
                sconfitte: document.getElementById('sconfitte').value || "0",
                pareggi: document.getElementById('pareggi').value || "0",
                data: new Date().toLocaleString()
            };

            if(!dati.nome || !dati.cognome || !dati.email || !dati.lega) {
                alert('Compila tutti i campi obbligatori inclusa la Lega!');
                return;
            }

            btn.disabled = true;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dati)
                });
                
                // PULISCI I CAMPI
                ['nome','cognome','email','team','peso'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('vittorie').value = '0';
                document.getElementById('sconfitte').value = '0';
                document.getElementById('pareggi').value = '0';
                selectLega.selectedIndex = 0;

                // MOSTRA IL MODALE DI SUCCESSO
                const modale = document.getElementById('successModal');
                modale.classList.remove('opacity-0', 'pointer-events-none');
                modale.classList.add('opacity-100', 'pointer-events-auto');

            } catch (error) {
                console.error('Errore:', error);
                alert('Errore durante l\'invio. Riprova.');
            } finally {
                btn.disabled = false;
            }
        }

        function chiudiModale() {
            const modale = document.getElementById('successModal');
            modale.classList.remove('opacity-100', 'pointer-events-auto');
            modale.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
