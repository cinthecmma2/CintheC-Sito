<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cintech 10 (Ottobre) - CintheC Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .neon-lightning-bg {
            background-color: #020503;
            background-image: 
                linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(2, 5, 3, 0.85)),
                url('Immagini/fulmini-bg.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }
        .bar-lightning-bg {
            background-color: #000000;
            background-image: 
                linear-gradient(to bottom, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.88)),
                url('Immagini/fulmini-barra.jpg');
            background-size: cover;
            background-position: center;
        }
        .white-glow-text {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.7), 0 2px 6px rgba(0, 0, 0, 1);
        }
    </style>
</head>
<body class="neon-lightning-bg text-zinc-100 antialiased min-h-screen flex flex-col justify-between selection:bg-[#00ff66] selection:text-black">

    <header class="border-b border-zinc-800 bar-lightning-bg sticky top-0 z-50 shadow-md h-16 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 w-full flex justify-between items-center relative z-10">
            <div class="flex items-center">
                <img src="Immagini/Logo.png" alt="CintheC Media Logo" class="h-28 sm:h-40 w-auto object-contain transform translate-y-2 sm:translate-y-4" onerror="this.onerror=null; this.src='Immagini/logo.png';">
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-zinc-900 hover:bg-zinc-800 text-[#00ff66] border border-[#00ff66]/40 text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-arrow-left"></i> Torna a CintheC 9
                </a>
            </div>
        </div>
    </header>

    <section class="relative z-10 py-16 px-4 max-w-4xl mx-auto w-full text-center">
        <div class="bg-zinc-950/90 border border-zinc-800 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-md">
            <span class="bg-[#00ff66]/20 text-[#00ff66] text-xs font-black uppercase px-3.5 py-1.5 rounded-full border border-[#00ff66]/30 inline-block mb-4 shadow-md">Prossimo Evento • Ottobre</span>
            <h1 class="text-3xl sm:text-5xl font-black uppercase tracking-tight text-white mb-4">
                CintheC 10 in arrivo
            </h1>
            <p class="white-glow-text text-sm sm:text-base max-w-xl mx-auto mb-8 font-semibold text-zinc-300">
                Manca poco alla prossima battaglia. Scopri la locandina ufficiale dell'evento: i pacchetti foto e video saranno disponibili online subito dopo i match!
            </p>

            <div class="relative rounded-2xl overflow-hidden border border-zinc-700 shadow-2xl max-w-md mx-auto aspect-[3/4] bg-black">
                <img src="Immagini/locandina-cinthec10.jpg" alt="Locandina CintheC 10" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>

            <div class="mt-8">
                <a href="index.html" class="inline-flex items-center gap-2 bg-[#00ff66] hover:bg-[#00cc52] text-black font-black text-sm px-6 py-3 rounded-2xl transition shadow-lg shadow-[#00ff66]/20">
                    <i class="fa-solid fa-house"></i> Torna alla Home principale
                </a>
            </div>
        </div>
    </section>

    <footer class="relative z-10 py-8 text-zinc-400 text-xs border-t border-zinc-800 bar-lightning-bg mt-12 text-center">
        <p>© 2026 CINtheC Media. Tutti i diritti riservati.</p>
    </footer>

</body>
</html>
