<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CintheC Media - Iscrizione Torneo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8fafc; }
        button, a, input, select { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active, a.inline-flex:active { transform: scale(0.97) !important; }

        .tech-diagonal-bg {
            background-image: 
                linear-gradient(135deg, rgba(15, 23, 42, 0.02) 25%, transparent 25%), 
                linear-gradient(225deg, rgba(15, 23, 42, 0.02) 25%, transparent 25%), 
                linear-gradient(45deg, rgba(15, 23, 42, 0.02) 25%, transparent 25%), 
                linear-gradient(315deg, rgba(15, 23, 42, 0.02) 25%, #f8fafc 25%),
                radial-gradient(rgba(15, 23, 42, 0.05) 1px, transparent 1px);
            background-size: 40px 40px, 40px 40px, 40px 40px, 40px 40px, 20px 20px;
        }

        .pro-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-bottom: 1px solid #334155; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.2); }
        .pro-footer-compact { background-color: #0f172a; color: #94a3b8; border-top: 1px solid #1e293b; font-size: 11px; }

        .nav-tech-btn {
            background-color: #334155; border: 1px solid #475569; color: #ffffff;
            padding: 6px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 6px;
            border-radius: 6px; text-decoration: none; white-space: nowrap;
        }
        .nav-tech-btn:hover { border-color: #22c55e; background-color: #0f172a; color: #22c55e; }

        .registration-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04); max-width: 700px; margin: 0 auto;
        }
        .logo-left-cinthec { width: 120px !important; height: 45px !important; object-fit: contain !important; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    </style>
</head>
<body class="tech-diagonal-bg text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <header class="pro-header sticky top-0 z-50 h-16 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 w-full flex items-center justify-between">
            <a href="tornei.html" class="flex items-center">
                <img src="Immagini/Logo.png" alt="CintheC Media Logo" class="logo-left-cinthec" onerror="this.onerror=null; this.src='Immagini/Logo.png';">
            </a>
            <a href="tornei.html" class="nav-tech-btn">
                <i class="fa-solid fa-arrow-left text-emerald-400"></i> Torna ai Tornei
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex flex-col justify-center">
        <div class="text-center mb-6">
            <span class="bg-emerald-50 text-emerald-700 text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full border border-emerald-200 mb-2 inline-block">
                Registrazione Ufficiale Atleta
            </span>
            <h1 id="tournamentTitleDisplay" class="text-xl sm:text-2xl font-black uppercase tracking-tight text-slate-900 mb-1">CintheC Tournament - Iscrizione Gara</h1>
            <p class="text-xs text-slate-500">Compila i campi sottostanti per registrare l'atleta direttamente nel cloud.</p>
        </div>

        <div class="registration-card p-6 sm:p-8">
            <form onsubmit="handleRegistration(event)" class="space-y-4">
                <input type="hidden" id="hiddenTournamentName" value="CintheC Tournament">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Nome</label>
                        <input type="text" id="atletaNome" required placeholder="Mario" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Cognome</label>
                        <input type="text" id="atletaCognome" required placeholder="Rossi" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Email</label>
                        <input type="email" id="atletaEmail" required placeholder="email@email.com" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Team / Accademia</label>
                        <input type="text" id="atletaTeam" required placeholder="Nome Palestra" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-3 border-t border-slate-100">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Stile</label>
                        <select id="atletaStile" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                            <option value="" disabled selected>Seleziona...</option>
                            <option value="Brazilian Jiu-Jitsu (Gi)">Brazilian Jiu-Jitsu (Gi)</option>
                            <option value="Grappling (No-Gi)">Grappling (No-Gi)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Cintura</label>
                        <select id="atletaCintura" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                            <option value="" disabled selected>Seleziona...</option>
                            <option value="Cintura Bianca">Cintura Bianca</option>
                            <option value="Cintura Blu">Cintura Blu</option>
                            <option value="Cintura Porpora">Cintura Porpora</option>
                            <option value="Cintura Marrone">Cintura Marrone</option>
                            <option value="Cintura Nera">Cintura Nera</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Peso</label>
                        <select id="atletaPeso" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                            <option value="" disabled selected>Seleziona...</option>
                            <option value="-55kg">-55 kg</option>
                            <option value="-65kg">-65 kg</option>
                            <option value="-75kg">-75 kg</option>
                            <option value="-85kg">-85 kg</option>
                            <option value="+85kg">+85 kg</option>
                            <option value="OPEN / Assoluto">OPEN / Assoluto</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-50 p-3.5 rounded-lg border border-slate-200 flex items-center justify-between text-xs">
                    <span class="text-slate-600 font-medium">Quota Iscrizione Gara:</span>
                    <span class="font-black text-emerald-600 text-sm">30,00 €</span>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs uppercase py-3.5 rounded-lg transition shadow-sm cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lock"></i> Conferma Iscrizione & Invia al Cloud
                </button>
            </form>
        </div>
    </main>

    <footer class="pro-footer-compact py-3 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <p class="text-[10px] text-slate-400">CintheC Media & Leoni di San Marco © 2026</p>
        </div>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJSPDKtM2XMbiGQD1BQmmbafPPqpFTBxMpVwJyPHHFsEuwiBQAplQR6HwPGE5F1TNs/exec";

        window.addEventListener('DOMContentLoaded', () => {
            let urlParams = new URLSearchParams(window.location.search);
            let torneoName = urlParams.get('torneo');
            if (torneoName) {
                let decoded = decodeURIComponent(torneoName);
                document.getElementById('tournamentTitleDisplay').innerText = decoded + " - Iscrizione Gara";
                document.getElementById('hiddenTournamentName').value = decoded;
            }
        });

        function handleRegistration(e) {
            e.preventDefault();
            let btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Invio in corso al Cloud...';

            let atleta = {
                action: "iscrizioneTorneo",
                torneo: document.getElementById('hiddenTournamentName').value,
                nome: document.getElementById('atletaNome').value,
                cognome: document.getElementById('atletaCognome').value,
                email: document.getElementById('atletaEmail').value,
                team: document.getElementById('atletaTeam').value,
                stile: document.getElementById('atletaStile').value,
                cintura: document.getElementById('atletaCintura').value,
                peso: document.getElementById('atletaPeso').value,
                data: new Date().toLocaleString()
            };

            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(atleta) })
                .then(res => res.json())
                .then(data => {
                    alert("Iscrizione completata con successo! L'atleta è stato registrato nel cloud.");
                    window.location.href = "tornei.html";
                })
                .catch(err => {
                    console.error(err);
                    alert("Errore di connessione al cloud. Riprova tra un istante.");
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-lock"></i> Conferma Iscrizione & Invia al Cloud';
                });
        }
    </script>
</body>
</html>
