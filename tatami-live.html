<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmoothTech - Gestione Tatami Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .match-card { background: #1e293b; border: 1.5px solid #334155; border-radius: 8px; transition: all 0.2s ease; }
        .match-card.active { border-color: #059669; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- HEADER TATAMI LIVE -->
    <header class="bg-slate-900 border-b border-slate-800 h-16 flex items-center shadow-lg">
        <div class="max-w-5xl mx-auto px-4 w-full flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-emerald-600 text-white font-extrabold text-xs uppercase px-3 py-1 rounded-lg shadow-inner">
                    <i class="fa-solid fa-desktop mr-1"></i> Tatami Live
                </span>
                <span id="headerTatamiTitle" class="text-xs text-slate-400 font-bold uppercase tracking-wider">Nessun Tatami Selezionato</span>
            </div>
            <div>
                <button onclick="cambiaTatami()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs uppercase px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> Cambia Tatami
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- STEP 1: SELEZIONE TATAMI ATTIVI -->
        <div id="selectionStep" class="bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-xl text-center max-w-xl mx-auto mt-10">
            <div class="mb-6">
                <i class="fa-solid fa-map-location-dot text-emerald-500 text-4xl mb-3"></i>
                <h1 class="text-xl font-black uppercase tracking-tight text-white">Seleziona il tuo tatami</h1>
                <p class="text-xs text-slate-400 mt-1">Questi sono i tatami attualmente accesi e operativi dall'amministrazione.</p>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="tatamiButtonsGrid">
                <!-- Generati dinamicamente dal Cloud -->
            </div>
            <button onclick="caricaTatamiAttivi()" class="text-xs text-emerald-400 hover:underline font-bold uppercase cursor-pointer">
                <i class="fa-solid fa-rotate mr-1"></i> Aggiorna Tatami Attivi
            </button>
        </div>

        <!-- STEP 2: GESTIONE INCONTRI DEL TATAMI -->
        <div id="liveStep" class="hidden space-y-6">
            <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div>
                    <h2 id="activeTatamiHeading" class="text-lg font-black uppercase text-emerald-400">Tatami -</h2>
                    <p class="text-xs text-slate-400">Gestione incontri in tempo reale e assegnazione vincitori.</p>
                </div>
                <button onclick="caricaDatiTatami()" class="bg-slate-800 hover:bg-emerald-600 text-white font-bold text-xs uppercase px-3.5 py-2 rounded-lg transition cursor-pointer flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Aggiorna Scaletta
                </button>
            </div>

            <!-- Lista Incontri del Tatami -->
            <div id="matchesContainer" class="space-y-4">
                <!-- Inserito via JS -->
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-3 px-6 text-center text-[11px] text-slate-500">
        SmoothTech Tatami Terminal - CintheC Media © 2026
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJSPDKtM2XMbiGQD1BQmmbafPPqpFTBxMpVwJyPHHFsEuwiBQAplQR6HwPGE5F1TNs/exec";
        let currentTatami = null;

        window.addEventListener('DOMContentLoaded', () => {
            caricaTatamiAttivi();
        });

        function caricaTatamiAttivi() {
            let grid = document.getElementById('tatamiButtonsGrid');
            grid.innerHTML = '<div class="col-span-full py-6 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Sincronizzazione tatami attivi...</div>';

            fetch(SCRIPT_URL + "?action=getStatoTatami&t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    let attivi = (data && data.tatamiAttivi) ? data.tatamiAttivi.map(Number) : [];
                    grid.innerHTML = '';

                    if (attivi.length === 0) {
                        grid.innerHTML = `<div class="col-span-full py-4 text-amber-400 text-xs font-bold bg-amber-500/10 border border-amber-500/20 rounded-lg">Nessun tatami attivo al momento. Accendine almeno uno dalla dashboard amministrativa.</div>`;
                        return;
                    }

                    attivi.sort((a, b) => a - b).forEach(num => {
                        grid.innerHTML += `
                            <button onclick="selezionaTatami(${num})" class="bg-slate-800 hover:bg-emerald-600 hover:border-emerald-500 border border-slate-700 text-white font-black text-sm uppercase py-4 rounded-lg transition cursor-pointer shadow-sm flex flex-col items-center justify-center gap-1">
                                <span>Tatami ${num}</span>
                                <span class="text-[9px] bg-emerald-600/30 text-emerald-400 px-2 py-0.5 rounded-full font-bold">ONLINE</span>
                            </button>
                        `;
                    });
                })
                .catch(err => {
                    grid.innerHTML = `<div class="col-span-full py-4 text-red-400 text-xs font-bold">Errore di connessione al cloud. Riprova.</div>`;
                });
        }

        function selezionaTatami(num) {
            currentTatami = num;
            document.getElementById('headerTatamiTitle').innerText = `Tatami ${num} Attivo`;
            document.getElementById('activeTatamiHeading').innerText = `Tatami ${num} - Terminale Tavolo`;
            
            document.getElementById('selectionStep').classList.add('hidden');
            document.getElementById('liveStep').classList.remove('hidden');

            caricaDatiTatami();
        }

        function cambiaTatami() {
            currentTatami = null;
            document.getElementById('headerTatamiTitle').innerText = 'Nessun Tatami Selezionato';
            document.getElementById('liveStep').classList.add('hidden');
            document.getElementById('selectionStep').classList.remove('hidden');
            caricaTatamiAttivi();
        }

        function caricaDatiTatami() {
            let container = document.getElementById('matchesContainer');
            container.innerHTML = `
                <div class="text-center py-12 text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><br>Caricamento incontri per il Tatami ${currentTatami}...
                </div>
            `;

            // Puntiamo correttamente al foglio dedicato MatchTatamiLive
            fetch(SCRIPT_URL + "?action=getMatchTatamiLive&t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    let matches = (data && data.matchSalvati) ? data.matchSalvati.filter(m => Number(m.tatamiId) === Number(currentTatami)) : [];
                    
                    if (matches.length === 0) {
                        container.innerHTML = `<div class="col-span-full py-12 text-slate-400 text-xs bg-slate-900 border border-slate-800 rounded-xl">Nessun incontro in programma per questo tatami. Dalla dashboard admin clicca su "Distribuisci Pool sui Tatami".</div>`;
                        return;
                    }

                    let matchCorrente = matches[0];
                    container.innerHTML = `
                        <div class="match-card active p-5">
                            <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-700">
                                <span class="bg-emerald-600 text-white font-black text-[10px] uppercase px-2.5 py-1 rounded">Incontro in Corso</span>
                                <span class="text-xs text-slate-400 font-semibold">Categoria / Lega: ${matchCorrente.lega || 'Generale'}</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
                                <div class="bg-slate-900 border border-slate-700 p-3.5 rounded-lg text-center">
                                    <span class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Angolo Rosso</span>
                                    <span class="text-sm font-black text-white block">${matchCorrente.atleta1}</span>
                                    <span class="text-[10px] text-slate-500 block">${matchCorrente.team1 || 'Team'}</span>
                                    <button onclick="registraVincitore('${matchCorrente.atleta1}', '${matchCorrente.atleta2}')" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase py-2 rounded transition cursor-pointer">
                                        Vince Rosso <i class="fa-solid fa-check ml-1"></i>
                                    </button>
                                </div>
                                <div class="bg-slate-900 border border-slate-700 p-3.5 rounded-lg text-center">
                                    <span class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Angolo Blu</span>
                                    <span class="text-sm font-black text-white block">${matchCorrente.atleta2}</span>
                                    <span class="text-[10px] text-slate-500 block">${matchCorrente.team2 || 'Team'}</span>
                                    <button onclick="registraVincitore('${matchCorrente.atleta2}', '${matchCorrente.atleta1}')" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase py-2 rounded transition cursor-pointer">
                                        Vince Blu <i class="fa-solid fa-check ml-1"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                })
                .catch(err => {
                    container.innerHTML = `<div class="text-center py-12 text-red-400 text-xs bg-slate-900 border border-slate-800 rounded-xl">Errore nel caricamento dei match dal cloud.</div>`;
                });
        }

        function registraVincitore(vincitore, sconfitto) {
            if (confirm(`Confermi la vittoria di "${vincitore}" per questo incontro?`)) {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "eliminaMatchTatami", atleta1: vincitore, atleta2: sconfitto })
                })
                .then(res => res.json())
                .then(res => {
                    alert("Risultato registrato! Il tabellone avanza al match successivo.");
                    caricaDatiTatami();
                })
                .catch(err => {
                    alert("Errore di comunicazione con il cloud.");
                });
            }
        }
    </script>
</body>
</html>
